<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  --border: #2b251d; --text: #ece4d2; --text-2: #a79c86; --text-3: #6f6655;

}
html, body { height: 100%; }
body {

/* ─── THE DOOR ─── */
.door-kicker {
  font-family: var(--mono); font-size: 10px; letter-spacing: 4px;
  text-transform: uppercase; color: var(--text-3); margin-bottom: 20px;

  font-family: var(--mono); font-size: 11px; letter-spacing: 2px;

}
.door-wrap { position: relative; padding: 20px; cursor: pointer; -webkit-tap-highlight-color: transparent; }
.door-frame { width: 150px; height: 260px; perspective: 900px; position: relative; }
.door-panel {
  position: absolute; inset: 0;
  background: linear-gradient(105deg, #181310 0%, #0f0c09 100%);
  border: 1px solid #2b251d;
  transform-origin: left center;
  transition: transform 1.7s cubic-bezier(0.62, 0.02, 0.28, 1);
}
.door-panel::after {
  content: ''; position: absolute; top: 0; right: 0; width: 2px; height: 100%;
  background: linear-gradient(to bottom, transparent, rgba(217,154,69,0.7) 30%, rgba(224,120,60,0.95) 50%, rgba(217,154,69,0.7) 70%, transparent);
  box-shadow: 0 0 20px 4px rgba(217,140,60,0.3);
}
.door-light {
  position: absolute; bottom: 6px; left: 50%; transform: translateX(-50%);
  width: 120px; height: 10px;
  background: radial-gradient(ellipse at center, rgba(224,150,70,0.75), transparent 70%);
  filter: blur(5px);
}
.door-frame.open .door-panel { transform: rotateY(-78deg); }
.door-light.spill { animation: spill 1.5s ease-out forwards; }
@keyframes spill { to { width: 380px; height: 46px; opacity: 0.95; } }
.door-wrap.knocked .door-frame { animation: doorShake 0.34s ease; }
@keyframes doorShake {
  0%, 100% { transform: translateX(0); }
  25% { transform: translateX(-2px); }
  55% { transform: translateX(2px); }
  80% { transform: translateX(-1px); }
}
.door-hint {
  margin-top: 44px;
  font-family: var(--mono); font-size: 10px; letter-spacing: 3.5px;
  text-transform: uppercase; color: var(--text-3);
  animation: hintPulse 2.6s ease-in-out infinite;
}
@keyframes hintPulse { 0%, 100% { opacity: 0.45; } 50% { opacity: 1; } }
.door-review {
  margin-top: 18px;
  font-family: var(--mono); font-size: 10px; letter-spacing: 1.5px;
  color: var(--text-3); background: none; border: none; cursor: pointer;
  text-decoration: underline; text-underline-offset: 3px;
}
.door-review:hover { color: var(--accent-2); }

/* ─── QUESTIONS ─── */
.q-screen::before {
  content: ''; position: absolute; inset: 0; pointer-events: none;
}
.q-screen.tint-house::before { background: radial-gradient(ellipse at 50% 62%, rgba(30,34,44,0.14), transparent 70%); }

.q-screen.tint-woods::before { background: radial-gradient(ellipse at 50% 62%, rgba(34,52,34,0.14), transparent 70%); }
.q-screen.tint-body::before { background: radial-gradient(ellipse at 50% 62%, rgba(72,18,12,0.13), transparent 70%); }
.q-screen.tint-quiet::before { background: radial-gradient(ellipse at 50% 62%, rgba(52,38,16,0.12), transparent 70%); }
.q-num {
  font-family: var(--mono); font-size: 10px; letter-spacing: 4px;

}
.q-text {
  font-size: clamp(26px, 3.6vw, 40px); font-style: italic; font-weight: 400;
  line-height: 1.32; max-width: 800px; margin-bottom: 56px;
  animation: qIn 0.9s cubic-bezier(0.2, 0.7, 0.3, 1) both;
}
@keyframes qIn {
  0% { opacity: 0; filter: blur(10px); transform: translateY(12px); }
  55% { opacity: 0.4; }
  100% { opacity: 1; filter: none; transform: none; }
}
.q-choices { display: flex; flex-direction: column; gap: 14px; width: min(620px, 94vw); position: relative; z-index: 1; }
.q-choice {
  display: flex; align-items: flex-start; gap: 16px; text-align: left;

  padding: 20px 22px; cursor: pointer;
  transition: border-color 0.25s, color 0.25s, transform 0.25s, background 0.25s;
  animation: qIn 0.8s cubic-bezier(0.2, 0.7, 0.3, 1) both;
}
.q-choice:nth-child(1) { animation-delay: 0.18s; }
.q-choice:nth-child(2) { animation-delay: 0.34s; }
.q-choice:hover {
  border-color: rgba(224,87,63,0.6); color: var(--text);
  transform: translateX(6px); background: rgba(30,25,20,0.72);
}
.q-key { color: var(--accent-2); font-weight: 700; flex: none; }

/* ─── DIAGNOSIS ─── */
.diag-screen { justify-content: flex-start; padding: 92px 24px 64px; }
.diag-kicker {
  font-family: var(--mono); font-size: 10px; letter-spacing: 4px;
  text-transform: uppercase; color: var(--text-3);
}
.diag-stamp {
  font-size: clamp(42px, 6.5vw, 78px); font-weight: 500; letter-spacing: 1px;
  margin: 16px 0 20px; color: var(--text);
  text-shadow: 0 0 44px rgba(181,55,42,0.35);
  animation: stampIn 1.1s cubic-bezier(0.2, 0.7, 0.3, 1) 0.25s both;
}
@keyframes stampIn {
  0% { opacity: 0; filter: blur(14px); transform: scale(1.07); }
  25% { opacity: 0.5; }
  38% { opacity: 0.15; }
  55% { opacity: 1; }
  68% { opacity: 0.6; }
  100% { opacity: 1; filter: none; transform: none; }
}
.diag-desc {
  font-style: italic; font-size: 17px; color: var(--text-2);

}
.diag-bars { width: min(460px, 92vw); margin-bottom: 44px; }
.fp-row { display: flex; align-items: center; gap: 12px; margin: 9px 0; }
.fp-label {
  width: 118px; text-align: right;

}
.fp-track { flex: 1; height: 7px; background: rgba(236,228,210,0.07); border-radius: 1px; overflow: hidden; }
.fp-fill {
  display: block; height: 100%; background: var(--accent); border-radius: 1px;

}
@keyframes fpGrow { from { width: 0; } }
.fp-val { width: 20px; font-family: var(--mono); font-size: 10px; color: var(--text-2); }
.diag-rx-label {
  font-family: var(--mono); font-size: 10px; letter-spacing: 3px;

}
.diag-rx-label::after { content: ' ———'; color: var(--border); letter-spacing: 0; }
.diag-cards { display: flex; flex-direction: column; gap: 12px; width: min(580px, 95vw); margin: 20px 0 36px; }
.rx-card {
  display: flex; gap: 16px; align-items: center;
  border: 1px solid var(--border); background: rgba(22,19,16,0.55);
  padding: 12px 16px 12px 12px; text-decoration: none; border-radius: 2px;
  transition: border-color 0.25s, transform 0.25s;
  animation: qIn 0.8s cubic-bezier(0.2, 0.7, 0.3, 1) both;
}
.rx-card:nth-child(1) { animation-delay: 0.1s; }
.rx-card:nth-child(2) { animation-delay: 0.25s; }
.rx-card:nth-child(3) { animation-delay: 0.4s; }
.rx-card:hover { border-color: rgba(224,87,63,0.6); transform: translateX(6px); }
.rx-poster { width: 62px; aspect-ratio: 2/3; object-fit: cover; border-radius: 2px; flex: none; filter: saturate(0.85); }
.rx-info { flex: 1; min-width: 0; text-align: left; }
.rx-title { font-size: 19px; color: var(--text); font-weight: 500; }
.rx-meta { font-family: var(--mono); font-size: 10px; letter-spacing: 0.5px; color: var(--text-3); margin-top: 3px; }
.rx-bottom { display: flex; align-items: center; gap: 14px; margin-top: 8px; flex-wrap: wrap; }
.rx-stream { font-family: var(--mono); font-size: 9px; letter-spacing: 0.5px; color: var(--text-3); }
.rx-match { text-align: center; flex: none; }
.rx-match .pct { font-family: var(--mono); font-size: 16px; font-weight: 700; color: var(--gold); display: block; }
.rx-match .lbl { font-family: var(--mono); font-size: 8px; letter-spacing: 1.5px; text-transform: uppercase; color: var(--text-3); }
.vital { display: flex; align-items: flex-end; gap: 2.5px; }
.vital-label { font-family: var(--mono); font-size: 8px; letter-spacing: 1px; color: var(--text-3); margin-right: 3px; line-height: 1; }
.vital i { display: block; width: 3px; background: rgba(236,228,210,0.16); }
.vital i.on { background: var(--accent-2); }
.vital i:nth-of-type(1) { height: 4px; } .vital i:nth-of-type(2) { height: 6px; }
.vital i:nth-of-type(3) { height: 8px; } .vital i:nth-of-type(4) { height: 10px; }
.vital i:nth-of-type(5) { height: 12px; }
.vital i.g.on { background: var(--gold); }
.diag-actions { display: flex; align-items: center; gap: 26px; flex-wrap: wrap; justify-content: center; }
.diag-btn {
  font-family: var(--mono); font-size: 10px; letter-spacing: 2px; text-transform: uppercase;
  color: var(--text-3); background: none; border: none; cursor: pointer;
  text-decoration: none; transition: color 0.25s;
}
.diag-btn:hover { color: var(--text); }
.diag-btn.primary { color: var(--accent-2); border-bottom: 1px dotted rgba(224,87,63,0.6); padding-bottom: 2px; }
.diag-btn.primary:hover { color: var(--text); }
.diag-note {
  margin-top: 34px; font-family: var(--mono); font-size: 10px;
  letter-spacing: 1px; color: var(--text-3);
}
.diag-note em { color: var(--text-2); font-style: normal; }

@media (max-width: 640px) {
  .door-frame { width: 118px; height: 205px; }
  .door-sub { margin-bottom: 40px; }
  .q-text { margin-bottom: 40px; }
  .q-choice { padding: 16px 18px; font-size: 12px; }
  .diag-screen { padding: 76px 16px 48px; }
}
@media (prefers-reduced-motion: reduce) {
  .q-text, .q-choice, .diag-stamp, .rx-card, .fp-fill { animation: none !important; }
  .door-hint { animation: none; opacity: 1; }
  .door-panel { transition-duration: 0.3s; }
  #cut { transition: none; }
}

<script>
// ─── SOUND (procedural, opt-in) ───
const Sound = {
  ctx: null, on: false, droneGain: null, droneOsc: null,
  init() {
    if (this.ctx) return;
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    this.ctx = new AC();
    this.master = this.ctx.createGain();
    this.master.gain.value = 0.6;
    this.master.connect(this.ctx.destination);
  },
  startDrone() {
    if (!this.ctx || this.droneGain) return;
    const ctx = this.ctx;
    this.droneGain = ctx.createGain();
    this.droneGain.gain.value = 0;
    this.droneGain.gain.linearRampToValueAtTime(0.055, ctx.currentTime + 3);
    this.droneGain.connect(this.master);
    [54, 55.7].forEach(f => {
      const o = ctx.createOscillator();
      o.type = 'sine'; o.frequency.value = f;
      o.connect(this.droneGain); o.start();
    });
    const o = ctx.createOscillator();
    o.type = 'triangle'; o.frequency.value = 108.3;
    const og = ctx.createGain(); og.gain.value = 0.18;
    o.connect(og); og.connect(this.droneGain); o.start();
    this.droneOsc = o;
  },
  stopDrone() {
    if (!this.droneGain) return;
    this.droneGain.gain.linearRampToValueAtTime(0, this.ctx.currentTime + 0.8);
    const g = this.droneGain;
    setTimeout(() => g.disconnect(), 1000);
    this.droneGain = null;
  },
  burst(freq, decay, gain, type) {
    if (!this.on || !this.ctx) return;
    const ctx = this.ctx;
    const o = ctx.createOscillator();
    o.type = type || 'sine'; o.frequency.value = freq;
    const g = ctx.createGain();
    g.gain.setValueAtTime(gain, ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + decay);
    o.connect(g); g.connect(this.master);
    o.start(); o.stop(ctx.currentTime + decay + 0.05);
    const nb = ctx.createBufferSource();
    const buf = ctx.createBuffer(1, ctx.sampleRate * 0.09, ctx.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / d.length);
    nb.buffer = buf;
    const lp = ctx.createBiquadFilter();
    lp.type = 'lowpass'; lp.frequency.value = 420;
    const ng = ctx.createGain(); ng.gain.value = gain * 0.8;
    nb.connect(lp); lp.connect(ng); ng.connect(this.master);
    nb.start();
  },
  knock() { this.burst(88, 0.34, 0.5, 'sine'); },
  thud() { this.burst(52, 0.5, 0.28, 'sine'); },
  swell() {
    if (!this.on || !this.droneGain) return;
    const ctx = this.ctx;
    this.droneGain.gain.cancelScheduledValues(ctx.currentTime);
    this.droneGain.gain.linearRampToValueAtTime(0.11, ctx.currentTime + 1.6);
    this.droneGain.gain.linearRampToValueAtTime(0.055, ctx.currentTime + 5);
  },
  toggle() {
    this.init();
    if (!this.ctx) return false;
    this.on = !this.on;
    if (this.on) { this.ctx.resume(); this.startDrone(); }
    else this.stopDrone();
    return this.on;
  }
};
const soundBtn = document.getElementById('soundBtn');
soundBtn.addEventListener('click', () => {
  const on = Sound.toggle();
  soundBtn.textContent = on ? 'sound: on' : 'sound: off';
  soundBtn.setAttribute('aria-pressed', String(on));
});

// ─── THE CALIBRATION ───
const QUESTIONS = [
  { num: 'I', tint: 'house',
    text: 'The house at the end of your street has been empty for years. Tonight, a light is on.',
    a: { t: 'It glows in the basement. Something down there is knocking — slowly, in rhythm.', w: { supernatural: 2, isolation: 1 } },
    b: { t: 'It glows in the nursery. The monitor is playing a lullaby no one taught it.', w: { dolls: 2, supernatural: 1 } } },
  { num: 'II', tint: 'objects',
    text: 'You may keep one object. The other is burned.',
    a: { t: 'The photograph of everyone smiling. You don\u2019t remember being there when it was taken.', w: { psychological: 2, 'slow-burn': 1 } },
    b: { t: 'The tape labeled with your name, in handwriting you almost recognize.', w: { 'found-footage': 2, supernatural: 1 } } },
  { num: 'III', tint: 'woods',
    text: 'Worse to come across in the woods, alone:',
    a: { t: 'A circle of small wooden figures. Every one of them is facing you.', w: { folk: 2, cult: 1 } },
    b: { t: 'A door. Freestanding. No wall attached to it. Warm to the touch.', w: { cosmic: 2, isolation: 1 } } },
  { num: 'IV', tint: 'body',
    text: 'Your body turns on you. Pick the betrayal:',
    a: { t: 'Your reflection has started moving a half-second late.', w: { psychological: 2, 'body-horror': 1 } },
    b: { t: 'The cut on your palm healed overnight — into a shape you almost know.', w: { 'body-horror': 2, gore: 1 } } },
  { num: 'V', tint: 'quiet',
    text: 'Choose the quieter fear:',
    a: { t: 'Grief that one day answers the door wearing your mother\u2019s face.', w: { grief: 2, 'slow-burn': 1 } },
    b: { t: 'A god that has never once noticed you — and never will.', w: { religious: 2, cosmic: 1 } } },
];

const ARCHETYPES = [
  { when: w => (w.grief || 0) >= 2, name: 'THE MOURNER',
    desc: 'You fear what stays. Loss that refuses to leave the house — and learns to wear familiar faces.',
    note: 'Prescribe slowly. Do not watch alone after midnight.' },
  { when: w => (w.folk || 0) >= 2, name: 'THE HARVEST',
    desc: 'You fear what the village agreed to bury. Old gods, older debts, and a field that remembers.',
    note: 'Avoid solstice screenings.' },
  { when: w => (w['found-footage'] || 0) >= 2, name: 'THE ARCHIVIST',
    desc: 'You fear what the camera caught. Reality, once edited, is still reality.',
    note: 'Do not label tapes with your own name.' },
  { when: w => (w.dolls || 0) >= 2, name: 'THE SMALL HOURS',
    desc: 'You fear the object that moved. You will check the chair twice tonight. It will be patient.',
    note: 'Keep the nursery monitor on. Or off. It changes nothing.' },
  { when: w => (w.religious || 0) >= 2, name: 'THE FAITHFUL',
    desc: 'You fear the vertical axis: what answers prayer, and what collects on it.',
    note: 'Salt is a suggestion, not a barrier.' },
  { when: w => (w.cosmic || 0) >= 2, name: 'THE VOID LISTENER',
    desc: 'You fear scale. The universe is not cruel — it is indifferent, and that is worse.',
    note: 'The static is not trying to reach you. That is the problem.' },
  { when: w => (w['body-horror'] || 0) >= 2 && (w.psychological || 0) >= 2, name: 'THE MIRROR',
    desc: 'You fear yourself, correctly. The enemy has your face, your gait, and your spare key.',
    note: 'Check the reflection. Count the delay.' },
  { when: w => (w['body-horror'] || 0) >= 2 || (w.gore || 0) >= 2, name: 'FLESH & ROOT',
    desc: 'You fear the body is a door. It opens both ways, and it does not ask permission.',
    note: 'Eat beforehand. Or don\u2019t.' },
  { when: w => (w.psychological || 0) >= 2, name: 'THE MIRROR',
    desc: 'You fear yourself, correctly. The enemy has your face, your gait, and your spare key.',
    note: 'Check the reflection. Count the delay.' },
  { when: w => (w.supernatural || 0) >= 2, name: 'THE HOUSE SITTER',
    desc: 'You fear the floor plan: rooms that were not there yesterday, and the light that is on tonight.',
    note: 'Knock twice. It knocks back.' },
  { when: () => true, name: 'THE NIGHT AUDITOR',
    desc: 'You fear the pause between sounds. The archive respects that.',
    note: 'Everything is fine. That is what makes it strange.' },
];

const stage = document.getElementById('stage');
const cut = document.getElementById('cut');
const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
let weights = {}, knocks = 0, qi = 0, opened = false;

function esc(s) { return s.replace(/&/g, '&amp;').replace(/</g, '&lt;'); }
function slugify(t) { return t.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/(^-|-$)/g, ''); }
function vitalHTML(label, val, ember) {
  return `<span class="vital"><span class="vital-label">${label}</span>${Array.from({ length: 5 }, (_, i) => `<i class="${i < val ? 'on' : ''}${ember ? ' g' : ''}"></i>`).join('')}</span>`;
}
function burst(n) { if (window.atmoBurst) window.atmoBurst(n); }

function swap(html, after) {
  cut.classList.add('on');
  Sound.thud();
  setTimeout(() => {
    stage.innerHTML = html;
    cut.classList.remove('on');
    if (after) after();
  }, reduced ? 60 : 280);
}

// ─── DOOR ───
function showDoor() {
  knocks = 0; opened = false;
  let saved = null;
  try { saved = JSON.parse(localStorage.getItem('ws-diagnosis')); } catch (e) {}
  stage.innerHTML = `
    <section class="screen door-screen">
      <div class="door-kicker">Field N&ordm; 000 — an unlisted specimen</div>
      <h1 class="door-title">The Threshold</h1>
      <div class="door-sub">a calibration of fear &middot; five questions &middot; sixty seconds</div>
      <div class="door-wrap" id="doorWrap" role="button" aria-label="Knock on the door">
        <div class="door-light" id="doorLight"></div>
        <div class="door-frame" id="doorFrame"><div class="door-panel"></div></div>
      </div>
      <div class="door-hint" id="doorHint">knock twice</div>
      ${saved && saved.archetype ? `<button class="door-review" onclick="diagnose(true)">or review your diagnosis — ${saved.archetype} &rarr;</button>` : ''}
    </section>`;
  document.getElementById('doorWrap').addEventListener('click', knock);
}

function knock() {
  if (opened) return;
  knocks++;
  Sound.knock();
  burst(1);
  const wrap = document.getElementById('doorWrap');
  wrap.classList.remove('knocked');
  void wrap.offsetWidth;
  wrap.classList.add('knocked');
  const hint = document.getElementById('doorHint');
  if (knocks === 1) hint.textContent = 'again';
  if (knocks >= 2) {
    opened = true;
    hint.textContent = 'enter';
    document.getElementById('doorFrame').classList.add('open');
    document.getElementById('doorLight').classList.add('spill');
    Sound.swell();
    setTimeout(() => showQuestion(), reduced ? 400 : 1700);
  }
}

// ─── QUESTIONS ───
function showQuestion() {
  const q = QUESTIONS[qi];
  swap(`
    <section class="screen q-screen tint-${q.tint}">
      <div class="q-num">${q.num} / V</div>
      <p class="q-text th-vignette-text">${esc(q.text)}</p>
      <div class="q-choices">
        <button class="q-choice" data-side="a"><span class="q-key">A</span><span>${esc(q.a.t)}</span></button>
        <button class="q-choice" data-side="b"><span class="q-key">B</span><span>${esc(q.b.t)}</span></button>
      </div>
    </section>`, () => {
    stage.querySelectorAll('.q-choice').forEach(btn =>
      btn.addEventListener('click', () => choose(q[btn.dataset.side].w)));
  });
}

function choose(w) {
  Object.entries(w).forEach(([t, v]) => { weights[t] = (weights[t] || 0) + v; });
  burst(1);
  qi++;
  if (qi < QUESTIONS.length) showQuestion();
  else diagnose(false);
}

// ─── DIAGNOSIS ───
function recommend(w) {
  const scored = M.map((m, idx) => {
    let s = 0;
    m.tags.forEach(t => { if (w[t]) s += w[t]; });
    return { m, idx, s: s * 10 + (m.imdb || 5) * 0.4 + (m.rt || 50) * 0.004 };
  }).filter(x => x.s > 0).sort((a, b) => b.s - a.s);
  const picks = [], dirs = new Set();
  for (const x of scored) {
    if (picks.length >= 3) break;
    if (dirs.has(x.m.d)) continue;
    dirs.add(x.m.d);
    picks.push(x);
  }
  return picks;
}

function diagnose(fromSaved) {
  let arch, top, picks, file;
  const saved = (() => { try { return JSON.parse(localStorage.getItem('ws-diagnosis')); } catch (e) { return null; } })();
  if (fromSaved && saved) {
    arch = ARCHETYPES.find(a => a.name === saved.archetype) || ARCHETYPES[ARCHETYPES.length - 1];
    top = saved.top || [];
    file = saved.file || '0000';
    picks = (saved.slugs || []).map(s => {
      const idx = M.findIndex(m => slugify(m.t) === s);
      return idx >= 0 ? { m: M[idx], idx, s: 1 } : null;
    }).filter(Boolean);
    if (!picks.length) picks = recommend(saved.weights || {});
    weights = saved.weights || weights;
  } else {
    arch = ARCHETYPES.find(a => a.when(weights));
    top = Object.entries(weights).sort((a, b) => b[1] - a[1]).slice(0, 5);
    picks = recommend(weights);
    file = String(Math.floor(1000 + Math.random() * 9000));
    try {
      localStorage.setItem('ws-diagnosis', JSON.stringify({
        archetype: arch.name, file, top, weights,
        slugs: picks.map(p => slugify(p.m.t)), ts: Date.now(),
      }));
    } catch (e) {}
  }

  const maxW = top.length ? top[0][1] : 1;
  const maxS = picks.length ? picks[0].s : 1;
  const fpRows = top.map(([t, v]) => `
    <div class="fp-row">
      <span class="fp-label">${esc(t)}</span>
      <span class="fp-track"><span class="fp-fill" style="width:${Math.round(v / maxW * 100)}%"></span></span>
      <span class="fp-val">${v}</span>
    </div>`).join('');
  const cards = picks.map(p => {
    const pct = Math.max(58, Math.round(p.s / maxS * 97));
    const stream = p.m.str && p.m.str.length ? p.m.str.slice(0, 2).join(' · ') : '';
    return `<a class="rx-card" href="/movies/${slugify(p.m.t)}.html">
      <img class="rx-poster" src="https://image.tmdb.org/t/p/w185${p.m.p}" alt="${esc(p.m.t)}" loading="lazy">
      <div class="rx-info">
        <div class="rx-title">${esc(p.m.t)}</div>
        <div class="rx-meta">${p.m.y} · ${esc(p.m.d)}</div>
        <div class="rx-bottom">
          ${vitalHTML('S', p.m.scare)}${vitalHTML('G', p.m.gore, true)}${vitalHTML('D', p.m.dread)}
          ${stream ? `<span class="rx-stream">${esc(stream)}</span>` : ''}
        </div>
      </div>
      <div class="rx-match"><span class="pct">${pct}%</span><span class="lbl">match</span></div>
    </a>`;
  }).join('');

  swap(`
    <section class="screen diag-screen">
      <div class="diag-kicker">Diagnosis N&ordm; ${file}</div>
      <div class="diag-stamp">${arch.name}</div>
      <p class="diag-desc">${esc(arch.desc)}</p>
      <div class="diag-bars">${fpRows}</div>
      <div class="diag-rx-label">Prescribed viewing</div>
      <div class="diag-cards">${cards}</div>
      <div class="diag-actions">
        <a class="diag-btn primary" href="/">enter the archive &rarr;</a>
        <button class="diag-btn" id="copyBtn">copy diagnosis</button>
        <button class="diag-btn" id="retakeBtn">retake the calibration</button>
      </div>
      <div class="diag-note">FIELD NOTE — <em>${esc(arch.note)}</em></div>
    </section>`, () => {
    burst(3);
    Sound.swell();
    document.getElementById('retakeBtn').addEventListener('click', () => {
      weights = {}; qi = 0;
      showDoor();
    });
    document.getElementById('copyBtn').addEventListener('click', (e) => {
      const text = `DIAGNOSIS N\u00ba ${file} — ${arch.name}\n"${arch.desc}"\nFingerprint: ${top.map(([t, v]) => t + ' ' + v).join(' · ')}\nPrescribed: ${picks.map(p => p.m.t + ' (' + p.m.y + ')').join(' · ')}\n— whatscares.com/threshold.html`;
      const done = () => { e.target.textContent = 'copied'; setTimeout(() => { e.target.textContent = 'copy diagnosis'; }, 1800); };
      if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(done, done);
      else done();
    });
  });
}
window.diagnose = diagnose;

showDoor();
</script>
</body>
